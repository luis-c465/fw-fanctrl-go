name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release archive
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME#v}"
          STAGING_DIR="dist/fw-fanctrl-${VERSION}-linux-${GOARCH}"

          mkdir -p "$STAGING_DIR"
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "$STAGING_DIR/fw-fanctrl" ./cmd/fw-fanctrl
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "$STAGING_DIR/fw-fanctrld" ./cmd/fw-fanctrld
          cp resources/config.json "$STAGING_DIR/config.json"
          cp resources/config.schema.json "$STAGING_DIR/config.schema.json"

          tar -C dist -czf "dist/fw-fanctrl-${VERSION}-linux-${GOARCH}.tar.gz" "fw-fanctrl-${VERSION}-linux-${GOARCH}"

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: fw-fanctrl-linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
